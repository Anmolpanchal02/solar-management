<!DOCTYPE html>
<html>
<head><title>Create PWA Icons</title></head>
<body>
<h2>PWA Icon Generator</h2>
<canvas id="canvas192" width="192" height="192"></canvas><br>
<canvas id="canvas512" width="512" height="512"></canvas><br>
<button onclick="downloadIcons()">Download Icons</button>

<script>
function createIcon(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  
  // Blue background
  ctx.fillStyle = '#3b82f6';
  ctx.fillRect(0, 0, size, size);
  
  // Yellow sun circle
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/4, 0, Math.PI * 2);
  ctx.fill();
  
  // Sun rays
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = size/25;
  ctx.lineCap = 'round';
  
  for(let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 * i) / 8;
    const x1 = size/2 + Math.cos(angle) * (size/3.2);
    const y1 = size/2 + Math.sin(angle) * (size/3.2);
    const x2 = size/2 + Math.cos(angle) * (size/2.3);
    const y2 = size/2 + Math.sin(angle) * (size/2.3);
    
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  
  // Text
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${size/8}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Solar', size/2, size/1.5);
}

function downloadIcons() {
  const canvas192 = document.getElementById('canvas192');
  const canvas512 = document.getElementById('canvas512');
  
  // Download 192x192
  canvas192.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'icon-192x192.png';
    a.click();
  });
  
  // Download 512x512
  setTimeout(() => {
    canvas512.toBlob(function(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'icon-512x512.png';
      a.click();
    });
  }, 500);
}

createIcon('canvas192', 192);
createIcon('canvas512', 512);
</script>
</body>
</html>
